version: '3.8'

services:
  a2:
    build:
      context: .
    image: mfe/a2:humble
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=42
      - GITHUB_USER=${GITHUB_USER:-student}
    ports:
      - "8765:8765"
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch a2_grader grader.launch.py &
        sleep infinity
      "
