# Student-side scenario parameters for MFE A2.
#
# The '/**' wildcard applies these to every node regardless of namespace — the
# student's lpf_node runs under /<github_user>/lpf_node, so hardcoding the
# fully-qualified name would break as soon as someone changes their handle.
#
# alpha is fixed by the assignment (grader uses 0.1); do NOT change it.

/**:
  ros__parameters:
    alpha: 0.1
